<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Administrace nemá být ve vyhledávačích -->
  <meta name="robots" content="noindex, nofollow">
  <title>Přihlášení – Lukeš Lab admin</title>
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/admin.css?v=1">
  <script src="js/admin-mock.js?v=1" defer></script>
</head>

<!-- MOCK: přihlašovací obrazovka administrace svozů.
     V ostré verzi formulář odešle jméno a heslo na server. -->
<body data-page="login">

<div class="mock-banner">Ukázka obrazovek – data jsou smyšlená a nic se neukládá. Stačí kliknout na „Přihlásit“.</div>

<main class="login">
  <div class="login__card">
    <a class="logo" href="../index.html">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <rect x="1" y="1" width="32" height="32" rx="9" fill="#0B5C6B"/>
        <path d="M11 12c0-2 1.6-3 3.2-3 1.2 0 2 .6 2.8.6s1.6-.6 2.8-.6c1.6 0 3.2 1 3.2 3 0 3-1.2 4.4-1.6 7.2-.3 2.2-.7 5.8-2.1 5.8-1.3 0-1.2-4.2-2.3-4.2s-1 4.2-2.3 4.2c-1.4 0-1.8-3.6-2.1-5.8-.4-2.8-1.6-4.2-1.6-7.2z" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span class="logo__text">
        <span class="logo__name">Lukeš Lab</span>
        <span class="logo__sub">Administrace svozů</span>
      </span>
    </a>

    <h1>Přihlášení</h1>
    <p class="login__lead">Správa ordinací a plánování tras svozu a doručení.</p>

    <form class="login__form" id="login-form">
      <div class="field">
        <label for="login-email">E-mail</label>
        <input class="input" id="login-email" type="email" autocomplete="username" value="petr-lukes@seznam.cz">
      </div>
      <div class="field">
        <label for="login-password">Heslo</label>
        <input class="input" id="login-password" type="password" autocomplete="current-password" value="ukazka123">
      </div>
      <div class="login__row">
        <label><input type="checkbox" checked> Zůstat přihlášen</label>
        <a href="#">Zapomenuté heslo?</a>
      </div>
      <button class="btn btn--primary btn--block" type="submit">Přihlásit</button>
    </form>
  </div>
</main>

</body>
</html>
